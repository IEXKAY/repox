<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio de ESKAY</title>

    <!-- Fuentes de Google: Outfit (Tipografía moderna y premium) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Biblioteca de iconos Font Awesome (para botones, categorías, etc.) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Hoja de estilos externa (CSS) -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Efecto visual de fondo: Círculos brillantes difuminados (Glows) -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <!-- Contenedor principal de la aplicación -->
    <div class="app-container">

        <!-- CABECERA (Header): Logo, Barra de Búsqueda y Botón de Añadir Enlace -->
        <header class="app-header">
            <!-- Logotipo y Nombre del Sitio -->
            <div class="header-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <div class="logo-text">
                    <p>Repositorio de Enlaces</p>
                </div>
            </div>

            <!-- Buscador en tiempo real -->
            <div class="header-search">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" placeholder="Buscar juegos, herramientas, mods...">
                    <button id="clear-search" class="clear-btn" style="display: none;">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

        </header>

        <!-- PANEL DE ESTADÍSTICAS (Dashboard Stats) -->
        <section class="stats-dashboard">
            <!-- Tarjeta: Gaming -->
            <div class="stat-card">
                <div class="stat-icon gaming">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-gaming-count">0</h3>
                    <p>Gaming</p>
                </div>
            </div>
            <!-- Tarjeta: Herramientas -->
            <div class="stat-card">
                <div class="stat-icon tools">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-tools-count">0</h3>
                    <p>Herramientas</p>
                </div>
            </div>
            <!-- Tarjeta: Otros Enlaces -->
            <div class="stat-card">
                <div class="stat-icon others">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-others-count">0</h3>
                    <p>Otros Enlaces</p>
                </div>
            </div>
            <!-- Tarjeta: Total Guardados -->
            <div class="stat-card">
                <div class="stat-icon total">
                    <i class="fa-solid fa-link"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-total-count">0</h3>
                    <p>Total Guardados</p>
                </div>
            </div>
        </section>

        <!-- DISEÑO PRINCIPAL (Layout): Barra lateral + Cuadrícula de Contenido -->
        <div class="main-layout">

            <!-- BARRA LATERAL (Sidebar): Gestión e índice de categorías -->
            <aside class="sidebar">
                <div class="sidebar-box">
                    <div class="sidebar-header">
                        <h2>Categorías</h2>
                    </div>
                    <!-- Lista de categorías dinámicas cargadas por JS -->
                    <ul class="categories-list" id="categories-container">
                        <!-- Se insertan aquí con JavaScript -->
                    </ul>
                </div>
            </aside>

            <!-- ÁREA DE CONTENIDO: Título de sección + Cuadrícula de archivos -->
            <main class="content-area">
                <div class="content-header">
                    <h2 id="active-category-title">Todos los Enlaces</h2>

                    <!-- Filtro selector para ordenar las tarjetas -->
                    <div class="sort-selector">
                        <label for="sort-select">Ordenar por:</label>
                        <select id="sort-select">
                            <option value="recent">Más recientes</option>
                            <option value="oldest">Más antiguos</option>
                            <option value="alpha-asc">Nombre (A-Z)</option>
                            <option value="alpha-desc">Nombre (Z-A)</option>
                        </select>
                    </div>
                </div>

                <!-- Estado Vacío (Empty State): Se muestra cuando no hay enlaces para mostrar -->
                <div class="empty-state" id="empty-state" style="display: none;">
                    <div class="empty-icon">
                        <i class="fa-solid fa-folder-open"></i>
                    </div>
                    <h3>No se encontraron enlaces</h3>
                    <p>Ajusta tus filtros de búsqueda o categoría en la barra lateral.</p>
                </div>

                <!-- Cuadrícula (Grid) donde se renderizan las tarjetas de enlaces -->
                <div class="links-grid" id="links-grid">
                    <!-- Se insertan aquí con JavaScript -->
                </div>
            </main>
        </div>
    </div>



    <!-- Contenedor flotante para notificaciones emergentes (Toasts) -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Lógica principal de JavaScript -->
    <script src="app.js"></script>
</body>

</html>
